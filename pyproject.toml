[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-labor"
version = "0.2.0"
description = "Find freelance jobs an LLM agent can do profitably, bid on them, and do the work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    # Libraries available to the generated task scripts.
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
artificial-labor = "artificial_labor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
